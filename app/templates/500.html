{% extends 'base.html' %}

{% block title %}Server Error (500) | RP PHARMA{% endblock %}

{% block content %}
<section class="py-5 text-center" style="min-height: 60vh; display:flex; align-items:center;">
  <div class="container py-5">
    <div class="mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle shadow-sm p-4" style="width:100px; height:100px;">
        <i class="fa-solid fa-server text-danger fs-1"></i>
      </div>
    </div>
    <h1 class="display-4 fw-bold text-primary mb-2">500</h1>
    <h3 class="fw-bold text-dark mb-3">Internal Server Error</h3>
    <p class="text-muted lead fs-6 mx-auto mb-4" style="max-width: 500px;">
      An unexpected error occurred while processing your request. Our technical team has been notified.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-rp-primary">
      <i class="fa-solid fa-house me-2"></i> Return to Home
    </a>
  </div>
</section>
{% endblock %}
