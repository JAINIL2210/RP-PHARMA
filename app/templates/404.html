{% extends 'base.html' %}

{% block title %}Page Not Found (404) | RP PHARMA{% endblock %}

{% block content %}
<section class="py-5 text-center" style="min-height: 60vh; display:flex; align-items:center;">
  <div class="container py-5">
    <div class="mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle shadow-sm p-4" style="width:100px; height:100px;">
        <i class="fa-solid fa-triangle-exclamation text-teal fs-1"></i>
      </div>
    </div>
    <h1 class="display-4 fw-bold text-primary mb-2">404</h1>
    <h3 class="fw-bold text-dark mb-3">Page Not Found</h3>
    <p class="text-muted lead fs-6 mx-auto mb-4" style="max-width: 500px;">
      The page or formulation you are looking for might have been relocated, renamed, or is currently unavailable.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-rp-primary">
        <i class="fa-solid fa-house me-2"></i> Return Home
      </a>
      <a href="{{ url_for('products.list_products') }}" class="btn btn-rp-outline">
        <i class="fa-solid fa-boxes-stacked me-2"></i> Product Catalogue
      </a>
    </div>
  </div>
</section>
{% endblock %}
